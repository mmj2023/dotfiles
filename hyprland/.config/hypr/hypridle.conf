# $lock_cmd = hyprctl dispatch global quickshell:lock & pidof qs quickshell hyprlock || hyprlock
# $lock_cmd = pidof dms && dms ipc call lock lock
# $suspend_cmd = systemctl suspend || loginctl suspend
$lock_cmd = hyprlock
$suspend_cmd = systemctl suspend
$monitor_timeout = hyprctl dispatch dpms off; sleep 0.2; hyprctl dispatch dpms off
$monitor_on = hyprctl dispatch dpms on

general {
    lock_cmd = $lock_cmd
    # before_sleep_cmd = loginctl lock-session
    # after_sleep_cmd = hyprctl dispatch global quickshell:lockFocus
    before_sleep_cmd = $lock_cmd
    after_sleep_cmd = $monitor_on

}

listener {
    # timeout = 300 # 5mins
    timeout = 270 # 4.5mins
    on-timeout = $lock_cmd
}

