# kmscon configuration - managed in ~/dotfiles/kmscon/kmscon.conf
# Install:            pkexec cp ~/dotfiles/kmscon/kmscon.conf /etc/kmscon/kmscon.conf
# NOTE: this file must stay pure ASCII (the matugen apply helper enforces it).
#
# Palette (dynamic): do NOT hardcode colors here. The DMS theme palette is
# regenerated by matugen (template ~/dotfiles/kmscon/dms/matugen/kmscon-palette.conf)
# and spliced into /etc/kmscon/kmscon.conf by ~/dotfiles/kmscon/dms/libexec/kmscon-matugen-apply.
# After installing this file run the theme regen once:
#   ~/dotfiles/kmscon/regen-theme.sh

# --- Fonts (Nerd Fonts) ---
font-name=JetBrainsMono Nerd Font

# --- Terminal ---
term=kmscon
sb-size=3023

# --- Trackpad / mouse ---
# kmscon talks to evdev directly (no libinput) - input handling is its own raw
# evdev code, so libinput config files/quirks do NOT affect it. Only these two
# options exist. Native selection behaviour (see README for details):
#   drag select / double-click = copy (internal buffer); two-finger click or
#   tap on the touchpad = paste; physical button-plane right-click = resets.
#   Scrollback: two-finger scroll via the pad's emulated wheel node,
#   or keyboard grabs (Ctrl+Shift+Up/Down etc).
mouse=on
natural-scrolling=on

# --- Limitations (details in ~/dotfiles/kmscon/README.md) ---
# No tap-to-click / click-method / exec or clipboard grabs - such options do
# not exist in kmscon. Ctrl+Shift+C/V and Super+Shift+S are therefore NOT
# bindable; use the built-in selection + two-finger paste and
# ~/.local/bin/kmscon-screenshot instead.
