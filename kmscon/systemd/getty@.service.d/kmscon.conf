# /etc/systemd/system/getty@.service.d/kmscon.conf
# Replace agetty with kmscon so Ctrl+Alt+<F2..F7> opens a kmscon terminal.
# Use it from: ~/dotfiles/kmscon/systemd/getty@.service.d/kmscon.conf
#   pkexec install -Dm644 ~/dotfiles/kmscon/systemd/getty@.service.d/kmscon.conf \
#         /etc/systemd/system/getty@.service.d/kmscon.conf
#   pkexec systemctl daemon-reload
# tty1 is greetd (DMS greeter) and not affected: greetd holds the VT, and the
# getty@tty1 fallback (greetd dead) also just runs kmscon instead of agetty.
# kmscon must NOT be enabled as its own service (it would fight greetd on tty1).

[Service]
ExecStart=-/usr/bin/kmscon --vt %I
