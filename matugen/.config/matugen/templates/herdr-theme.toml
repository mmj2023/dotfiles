[theme]
name = "terminal"

[theme.custom]
accent = "{{ colors.primary.dark.hex }}"
panel_bg = "reset"
surface0 = "{{ colors.surface_container_low.dark.hex }}"
surface1 = "{{ colors.surface_container_high.dark.hex }}"
surface_dim = "{{ colors.surface_dim.dark.hex }}"
sidebar_bg = "reset"
text = "{{ colors.on_surface.dark.hex }}"
overlay0 = "{{ colors.outline.dark.hex }}"
overlay1 = "{{ colors.on_surface_variant.dark.hex }}"
subtext0 = "{{ colors.on_surface_variant.dark.hex }}"
mauve = "{{ colors.tertiary_container.dark.hex }}"
green = "{{ colors.primary.dark.hex }}"
yellow = "{{ colors.tertiary.dark.hex }}"
red = "{{ colors.error.dark.hex }}"
blue = "{{ colors.tertiary.dark.hex }}"
teal = "{{ colors.secondary.dark.hex }}"
peach = "{{ colors.error.dark.hex }}"

[keys]
prefix = "ctrl+s"
help = "prefix+?"
settings = "prefix+s"
detach = "prefix+d"
reload_config = "prefix+r"
workspace_picker = "prefix+shift+t"
goto = "prefix+g"
new_workspace = "prefix+shift+n"
new_worktree = "prefix+shift+g"
open_worktree = ""
remove_worktree = ""
rename_workspace = "prefix+shift+4"
close_workspace = ""
previous_workspace = "prefix+shift+9"
next_workspace = "prefix+shift+0"
previous_agent = ""
next_agent = ""
focus_agent = ""
new_tab = "prefix+c"
rename_tab = "prefix+comma"
previous_tab = "prefix+p"
next_tab = "prefix+n"
move_tab_previous = "prefix+shift+comma"
move_tab_next = "prefix+shift+period"
switch_tab = "prefix+1..9"
switch_workspace = ""
close_tab = "prefix+shift+7"
rename_pane = "prefix+shift+p"
edit_scrollback = "prefix+["
focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"
cycle_pane_next = "prefix+o"
cycle_pane_previous = "prefix+shift+o"
last_pane = "prefix+semicolon"
split_vertical = "prefix+shift+5"
split_horizontal = "prefix+shift+quote"
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = ""
resize_pane_left = "prefix+h"
resize_pane_down = "prefix+j"
resize_pane_up = "prefix+k"
resize_pane_right = "prefix+l"
toggle_sidebar = "prefix+b"
