[templates.flameshot]
input_path = '/home/mdmmj/.config/matugen/templates/flameshot_config.ini'
output_path = '/home/mdmmj/.config/flameshot/flameshot.ini'

[templates.copyq]
input_path = '/home/mdmmj/.config/matugen/templates/copyq_config.ini'
output_path = '/home/mdmmj/.config/copyq/themes/mine.ini'
post_hook = 'bash /home/mdmmj/.config/matugen/scripts/copyq.sh'

[templates.yazi]
input_path = '/home/mdmmj/.config/matugen/templates/yazi-theme.toml'
output_path = '/home/mdmmj/.config/yazi/theme.toml'

[templates.hyprshell]
input_path = '/home/mdmmj/.config/matugen/templates/hyprshell-theme.css'
output_path = '/home/mdmmj/.config/hyprshell/styles.css'
post_hook = 'bash /home/mdmmj/.config/matugen/scripts/pcmanfm.sh'

[templates.starship]
input_path = '/home/mdmmj/.config/matugen/templates/starship-theme.toml'
output_path = '/home/mdmmj/.config/starship.toml'

[templates.blerc]
input_path = '/home/mdmmj/.config/matugen/templates/blerc-theme.sh'
output_path = '/home/mdmmj/.blerc.sh'

[templates.hyprland]
input_path = '/home/mdmmj/.config/matugen/templates/matugen_colors.lua'
output_path = '/home/mdmmj/.config/hypr/dms/matugen_colors.lua'
post_hook = 'hyprctl reload'

[templates.hyprlock]
input_path = '/home/mdmmj/.config/matugen/templates/hyprlock-colors.conf'
output_path = '/home/mdmmj/.config/hypr/dms/hyprlock-colors.conf'

[templates.tmux]
input_path = '/home/mdmmj/.config/matugen/templates/tmux_theme.sh'
output_path = '/home/mdmmj/mytheme.conf'
post_hook = 'tmux source-file ~/.tmux.conf'

[templates.wayscriber]
input_path = '/home/mdmmj/.config/matugen/templates/wayscriber-theme.toml'
output_path = '/home/mdmmj/.config/wayscriber/config.toml'
post_hook = 'bash /home/mdmmj/.config/matugen/scripts/wayscriber.sh'

[templates.cosmic]
input_path = '/home/mdmmj/.config/matugen/templates/Dark.ron'
output_path = '/home/mdmmj/.config/cosmic/themes/Dark.ron'

[templates.herdr]
input_path = '/home/mdmmj/.config/matugen/templates/herdr-theme.toml'
output_path = '/home/mdmmj/dotfiles/herdr/.config/herdr/config.toml'
post_hook = 'if [ -S "$HOME/.config/herdr/herdr.sock" ]; then herdr server reload-config; fi'

[templates.herdr-app]
input_path = '/home/mdmmj/.config/matugen/templates/herdr-app-theme.json'
output_path = '/home/mdmmj/dotfiles/herdr-app/.config/herdr-app/themes/matugen.json'

[templates.ghostty]
input_path = '/home/mdmmj/.config/matugen/templates/ghostty-theme'
output_path = '/home/mdmmj/.config/ghostty/config-generated-colors'

[templates.terminal-opacity]
input_path = '/home/mdmmj/.config/matugen/templates/terminal-opacity-theme.sh'
output_path = '/home/mdmmj/.cache/terminal-opacity/theme.sh'

[templates.wine]
input_path = '/home/mdmmj/.config/matugen/templates/dms_theme.reg'
output_path = '/home/mdmmj/.local/share/matugen/dms_theme.reg'
post_hook = 'bash /home/mdmmj/.config/matugen/scripts/wine_theme.sh /home/mdmmj/.local/share/matugen/dms_theme.reg'

[templates.zsh-syntax-highlighting]
input_path = '/home/mdmmj/.config/matugen/templates/zsh-syntax-highlighting-theme.zsh'
output_path = '/home/mdmmj/.config/zsh-syntax-highlighting/theme.zsh'

[templates.obs-flatpak]
input_path = '/home/mdmmj/.config/matugen/templates/DMS.obt'
output_path = '/home/mdmmj/.var/app/com.obsproject.Studio/config/obs-studio/themes/DMS.obt'

[templates.obs-system]
input_path = '/home/mdmmj/.config/matugen/templates/DMS.obt'
output_path = '/home/mdmmj/.config/obs-studio/themes/DMS.obt'

[templates.vimium]
input_path = '/home/mdmmj/.config/matugen/templates/vimium-theme.css'
output_path = '/home/mdmmj/dotfiles/vimium/stylesheet.css'
