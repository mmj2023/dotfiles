# : Manager [[[

[mgr]
cwd = { fg = "#e1e3dd" }

# Tab
tab_active = { fg = "#043915", bg = "#9ed3a1", bold = true }
tab_inactive = { fg = "#baf0bb", bg = "#002108" }
tab_width = 1

# Find
find_keyword = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied = { fg = "#63b7ff", bg = "#63b7ff" }
marker_cut = { fg = "#c9e6ff", bg = "#c9e6ff" }
marker_marked = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#98ccf5", bg = "#98ccf5" }

# Count
count_copied = { fg = "#001e2f", bg = "#c9e6ff" }
count_cut = { fg = "#001e2f", bg = "#c9e6ff" }
count_selected = { fg = "#043915", bg = "#98ccf5" }

# Border
border_symbol = " "
border_style  = { fg = "#9ed3a1" }

# : ]]]


# : Status [[[

[status]
separator_open = "🭁"
separator_close = "🭠"
separator_style = { bg = "#043915", fg = "#F4A261" }

[mode]
# Mode
normal_main = { bg = "#9ed3a1", fg = "#043915", bold = true }
normal_alt  = { bg = "#414940", fg = "#c1c9bd" }

# Select mode
select_main = { bg = "#b6ccb4", fg = "#223524", bold = true }
select_alt  = { bg = "#414940", fg = "#c1c9bd" }

# Unset mode
unset_main = { bg = "#98ccf5", fg = "#00344e", bold = true }
unset_alt  = { bg = "#414940", fg = "#c1c9bd" }

# Progress
progress_label = { bold = true }
progress_normal = { fg = "#9ed3a1", bg = "#373a36" }
progress_error = { fg = "#ffb4ab", bg = "#373a36" }

# Permissions
permissions_t = { fg = "#618a5e" }
permissions_w = { fg = "#1686de" }
permissions_x = { fg = "#ff2b12" }
permissions_r = { fg = "#309fff" }
permissions_s = { fg = "#3cd53f" }

# : ]]]


# : Select [[[

[select]
border = { fg = "#9ed3a1" }
active = { fg = "#98ccf5", bold = true }

# : ]]]


# : Input [[[

[input]
border = { fg = "#9ed3a1" }
value = { fg = "#e1e3dd" }

# : ]]]

# : Tabs [[[

[tabs]
active = { fg = "#9ed3a1", bold = true, bg = "#111411" }
inactive = { fg = "#b6ccb4", bg = "#111411" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Completion [[[

[completion]
border = { fg = "#9ed3a1", bg = "#043915" }

# : ]]]


# : Tasks [[[

[tasks]
border = { fg = "#9ed3a1" }
title = {}
hovered = { fg = "#c9e6ff", underline = true }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#373a36" }
cand = { fg = "#9ed3a1" }
rest = { fg = "#043915" }
desc = { fg = "#e1e3dd" }
separator = " ▶ "
separator_style = { fg = "#e1e3dd" }

# : ]]]


# : Help [[[

[help]
on = { fg = "#e1e3dd" }
run = { fg = "#e1e3dd" }
footer = { fg = "#223524", bg = "#b6ccb4" }

# : ]]]


# : Notify [[[

[notify]
title_info = { fg = "#98ccf5" }
title_warn = { fg = "#9ed3a1" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { url = "*", is = "orphan", bg = "#93000a" },
    { url = "*", is = "exec", fg = "#ffdad6" },

    # Fallback
    { url = "*", fg = "#e1e3dd" },
    { url = "*/", fg = "#9ed3a1" },
]

# : ]]]
