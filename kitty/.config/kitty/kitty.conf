# font_family Symbols Nerd Font Mono
# Included theme and tab styling from dms
include dank-theme.conf
include dank-tabs.conf
font_family JetBrains Mono Nerd Font
font_size        12.0
background_opacity 0
enable_audio_bell no
cursor_shape block
term xterm-kitty

# font_size 15
hide_window_decorations titlebar-only
# hide_window_decorations yes
confirm_os_window_close 0
cursor none
# selection colors come from DMS via dank-theme.conf (kept identical to ghostty/alacritty)
shell_integration no-cursor
cursor_shape block
cursor_blink_interval 0.6
cursor_trail 10
cursor_trail_start_threshold 0
cursor_trail_decay 0.01 0.05
cursor_shape block
map f11 toggle_fullscreen

# transparency toggle: Ctrl+Alt+B (kitty reloads the config live via its own config watcher)
map ctrl+alt+b launch --type=background bash /home/mdmmj/.local/bin/toggle-terminal-opacity kitty

# --- BEGIN terminal-opacity-toggle (managed by toggle-terminal-opacity; do not edit) ---
background_opacity 1
background #111411
# --- END terminal-opacity-toggle ---
